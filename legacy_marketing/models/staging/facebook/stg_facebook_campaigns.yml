
version: 2

models:
  - name: stg_facebook_campaigns
    description: >
      Staging model containing Facebook advertising
      campaign information. Each record represents
      one unique Facebook campaign.

    columns:
      - name: campaign_id
        description: Unique Facebook campaign identifier.
        data_tests:
          - unique
          - not_null

      - name: campaign_name
        description: Name of the Facebook campaign.
        data_tests:
          - not_null

      - name: campaign_updated_at
        description: Timestamp of the latest campaign update.
        data_tests:
          - not_null
