
version: 2

models:
  - name: stg_facebook_accounts
    description: >
      Staging model containing Facebook advertising
      account information. Each row represents
      one unique Facebook account.

    columns:
      - name: account_id
        description: Unique Facebook account identifier.
        data_tests:
          - unique
          - not_null

      - name: account_name
        description: Facebook advertising account name.
        data_tests:
          - not_null

      - name: currency_code
        description: Currency used by the advertising account.
        data_tests:
          - not_null

      - name: account_created_at
        description: Timestamp when the account was created.
        data_tests:
          - not_null

      - name: account_updated_at
        description: Timestamp when the account was last updated.
        data_tests:
          - not_null
