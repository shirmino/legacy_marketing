
version: 2

models:
  - name: stg_facebook_adgroups
    description: >
      Staging model containing Facebook advertising
      ad group information. Each record represents
      one unique Facebook ad group.

    columns:
      - name: ad_group_id
        description: Unique Facebook ad group identifier.
        data_tests:
          - unique
          - not_null

      - name: ad_group_name
        description: Facebook ad group name.
        data_tests:
          - not_null

      - name: ad_group_updated_at
        description: Timestamp of the latest ad group update.
        data_tests:
          - not_null
