
version: 2

models:
  - name: dim_facebook_ads
    description: >
      Facebook advertisement dimension table.

      Contains descriptive information about Facebook
      advertisements, including their names, statuses,
      associated advertising accounts, campaigns,
      ad groups, and metadata update timestamps.

      The table is built from stg_facebook_ads
      and contains one record per unique ad_id.

      The account_id, campaign_id, and ad_group_id columns
      provide relationships to the corresponding Facebook
      dimension tables.

      This dimension supports advertisement-level reporting
      and analysis of Facebook advertising performance.
    #config:
     #contract:
       #enforced: true

    columns:

      - name: ad_id
        description: >
          Unique identifier of the Facebook advertisement.
          Serves as the primary key of this dimension and
          links advertisement metadata to performance facts.
        data_tests:
          - unique
          - not_null

      - name: ad_name
        description: >
          Descriptive name assigned to the Facebook
          advertisement in the source system.
        data_tests:
          - not_null

      - name: ad_status
        description: >
          Status of the Facebook advertisement as recorded
          in the source metadata. Represents the status
          available in the current source snapshot.
        data_tests:
          - not_null

      - name: account_id
        description: >
          Identifier of the Facebook advertising account
          associated with this advertisement.
          Foreign key to dim_facebook_accounts.account_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_facebook_accounts')
                field: account_id

      - name: campaign_id
        description: >
          Identifier of the Facebook advertising campaign
          associated with this advertisement.
          Foreign key to dim_facebook_campaigns.campaign_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_facebook_campaigns')
                field: campaign_id

      - name: ad_group_id
        description: >
          Identifier of the Facebook ad group
          containing this advertisement.
          Foreign key to dim_facebook_adgroups.ad_group_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_facebook_adgroups')
                field: ad_group_id

      - name: ad_updated_at
        description: >
          Timestamp indicating when the Facebook
          advertisement metadata was last updated
          in the source system.
        data_tests:
          - not_null
