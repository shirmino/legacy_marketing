
version: 2

models:
  - name: dim_facebook_campaigns
    description: >
      Facebook advertising campaign dimension table.

      Contains descriptive information about Facebook
      advertising campaigns, including their unique
      identifiers, campaign names, and update timestamps.

      The table is built from stg_facebook_campaigns
      and contains one record per unique campaign_id.

      This dimension supports campaign-level reporting
      and analysis of Facebook advertising performance.
    #config:
     #contract:
       #enforced: true

    columns:

      - name: campaign_id
        description: >
          Unique identifier of the Facebook advertising
          campaign. Serves as the primary key of this
          dimension and is used to associate campaign
          information with advertising performance data.
        data_tests:
          - unique
          - not_null

      - name: campaign_name
        description: >
          Descriptive name assigned to the Facebook
          advertising campaign in the source system.
          Used to identify campaigns in reporting
          and analytical dashboards.
        data_tests:
          - not_null

      - name: campaign_updated_at
        description: >
          Timestamp indicating when the Facebook advertising
          campaign information was last updated in the
          source system.
        data_tests:
          - not_null
