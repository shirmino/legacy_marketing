
name: dbt CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dbt-production
  cancel-in-progress: false

jobs:
  dbt-cd:
    name: Deploy dbt models to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Deploy and test production models
        working-directory: ./legacy_marketing
        env:
          DBT_TARGET: production
          DBT_PROFILES_DIR: ../.github
          DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
          DBX_SECRET: ${{ secrets.DBX_SECRET }}
        run: |
          uv run dbt deps --target production
          uv run dbt debug --target production
          uv run dbt build --target production
